<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="340" viewBox="0 0 1500 340" role="img" aria-labelledby="title desc">
<title id="title">Aditya B. Pattar — IoT Student, Developer, Builder</title>
<desc id="desc">A moonlit blue pixel-art kingdom with a small masked wanderer at left and a distant gothic citadel.</desc>
<image x="0" y="0" width="1500" height="340" preserveAspectRatio="xMidYMid slice" href="hallownest-night.jpg"/>
<defs>
  <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#020611" stop-opacity="0.02"/><stop offset="0.35" stop-color="#030916" stop-opacity="0.55"/><stop offset="0.66" stop-color="#030916" stop-opacity="0.62"/><stop offset="1" stop-color="#020611" stop-opacity="0.08"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071326" stop-opacity="0.04"/><stop offset="1" stop-color="#020711" stop-opacity="0.75"/></linearGradient>
</defs>
<rect width="1500" height="340" fill="url(#veil)"/>
<rect width="1500" height="340" fill="url(#edge)"/>
<text x="750" y="88" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="2.5" fill="#cad6ec" opacity="1">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="520" y="151" font-family="monospace" font-weight="700" font-size="43" letter-spacing="3" fill="#f2f5fb" opacity="1">
    <animate attributeName="fill" values="#f2f5fb;#ffffff;#f2f5fb" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="722" y="151" font-family="monospace" font-weight="700" font-size="43" letter-spacing="3" fill="#73aaff" opacity="1">
    <animate attributeName="fill" values="#73aaff;#9cc4ff;#73aaff" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="808" y="151" font-family="monospace" font-weight="700" font-size="43" letter-spacing="3" fill="#f2f5fb" opacity="1">
    <animate attributeName="fill" values="#f2f5fb;#ffffff;#f2f5fb" dur="4s" repeatCount="indefinite"/>
  </text>
  <path d="M714 173 H786" stroke="#68a7ff" stroke-width="2" opacity="1">
    <animate attributeName="stroke-dasharray" values="0,72;72,0" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </path>
  <text x="750" y="204" text-anchor="middle" font-family="monospace" font-size="16" fill="#e4eaf6" opacity="1">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="750" y="230" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="0.5" fill="#76b6ff" opacity="1">
    <animate attributeName="fill" values="#76b6ff;#9ccfff;#76b6ff" dur="6s" repeatCount="indefinite"/>
  </text>
<rect x="2" y="2" width="1496" height="336" rx="4" fill="none" stroke="#233b5d" stroke-width="2" opacity="0.8"/>
</svg>