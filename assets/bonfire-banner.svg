<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="340" viewBox="0 0 1500 340" role="img" aria-labelledby="title desc">
<title id="title">Bonfire Lit</title>
<desc id="desc">A cloaked masked wanderer sits beside an orange bonfire in an ancient blue cavern.</desc>
<image x="0" y="0" width="1500" height="340" preserveAspectRatio="xMidYMid slice" href="bonfire-camp.jpg"/>
<defs><linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#030913" stop-opacity="0"/><stop offset="0.38" stop-color="#030913" stop-opacity="0.05"/><stop offset="0.54" stop-color="#030913" stop-opacity="0.72"/><stop offset="1" stop-color="#030913" stop-opacity="0.38"/></linearGradient></defs>
<rect width="1500" height="340" fill="url(#shade)"/>
<text x="800" y="91" font-family="monospace" font-size="35" font-weight="700" letter-spacing="7" fill="#ff994f" opacity="1">
    <animate attributeName="fill" values="#ff994f;#ffb56e;#ff994f" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <path d="M801 111 H1438" stroke="#9a5d34" stroke-width="2" opacity="1">
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="804" y="156" font-family="monospace" font-size="16" fill="#e3e8f2" opacity="1">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="824" y="180" font-family="monospace" font-size="16" fill="#e3e8f2" opacity="1">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="804" y="226" font-family="monospace" font-size="14" fill="#ffbd7c" opacity="1">
    <animate attributeName="fill" values="#ffbd7c;#ffcf9e;#ffbd7c" dur="3s" repeatCount="indefinite"/>
  </text>
<rect x="2" y="2" width="1496" height="336" rx="4" fill="none" stroke="#593d35" stroke-width="2" opacity="0.85"/>
</svg>